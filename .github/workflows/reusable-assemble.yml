name: Assemble
on:
  workflow_call:
    inputs:
      project-version:
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  jar:
    name: Build release jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release jar
        run: mise run build --skip-tests package
      - name: Upload release jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 1
          name: artifact-jar
          path: target/sparql-mcp-${{ inputs.project-version }}.jar
          if-no-files-found: error
  assemble:
    name: Assemble ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            native_image_name: sparql-mcp-linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch_64
            native_image_name: sparql-mcp-linux-aarch_64
          - os: macos-latest
            platform: osx-aarch_64
            native_image_name: sparql-mcp-osx-aarch_64
          - os: windows-latest
            platform: windows-x86_64
            native_image_name: sparql-mcp-windows-x86_64
            # Disabled until the Windows ARM runner can install both
            # google-java-format and graalvm-community-25 via mise.
            # - os: windows-11-arm
            #   platform: windows-aarch_64
            #   native_image_name: sparql-mcp-windows-aarch_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: mise run build --clean --profile native --native-image-name "${{ matrix.native_image_name }}" native:compile
      - name: Prepare archive input
        shell: bash
        run: |
          src="target/${{ matrix.native_image_name }}"
          dest="target/release/sparql-mcp"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            src="${src}.exe"
            dest="${dest}.exe"
          fi

          mkdir -p target/release
          cp "$src" "$dest"
      - name: Assemble native archive
        uses: jreleaser/release-action@90ac653bb9c79d11179e65d81499f3f34527dcd5 # 2.5.0
        with:
          setup-java: false
          arguments: assemble
        env:
          JRELEASER_PROJECT_VERSION: ${{ inputs.project-version }}
      - name: Upload native artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 1
          name: artifact-${{ matrix.platform }}
          path: out/jreleaser/assemble/sparqlMcp/archive/*.zip
          if-no-files-found: error
  container:
    name: Publish container ${{ matrix.image_tag }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            image_tag: linux-amd64
          - os: ubuntu-24.04-arm
            arch: arm64
            image_tag: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pack
        uses: buildpacks/github-actions/setup-pack@a96fc9720ee9ccf19d4c87c3de9c344a2c404c29 # v6.2.0
      # Each architecture is built on its own native runner and published under a per-arch tag;
      # the release job combines them into the multi-arch image with pack manifest. The build
      # cache is kept in the registry, since CI runners start empty.
      - name: Build and publish image with pack
        env:
          IMAGE: ghcr.io/kludgeworks/sparql-mcp
        run: |
          pack build "${IMAGE}:${{ inputs.project-version }}-${{ matrix.image_tag }}" \
            --path . \
            --builder paketobuildpacks/builder-noble-java-tiny \
            --platform "linux/${{ matrix.arch }}" \
            --cache-image "${IMAGE}:build-cache-${{ matrix.image_tag }}" \
            --env BP_MAVEN_ACTIVE_PROFILES=native \
            --env BP_NATIVE_IMAGE=true \
            --env BP_JVM_VERSION=25 \
            --publish
